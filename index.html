<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kerala Weather</title>

    <!-- Favicon -->
    <link rel="icon"
        href="https://static.vecteezy.com/system/resources/previews/012/066/506/non_2x/sunny-and-windy-day-weather-forecast-icon-meteorological-sign-3d-render-png.png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            min-height: 100vh;
            background:
                linear-gradient(rgba(0, 0, 0, .4), rgba(0, 0, 0, .55)),
                url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTlxqWe2FbSXI5gDLvRFCQsrKDFzoZc_1Xdel5TtcMitA&s=10")
                center / cover fixed;
            color: white;
        }

        .glass {
            background: rgba(255, 255, 255, .16);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, .25);
        }

        .weather-card {
            transition: .3s;
        }

        .weather-card:hover {
            transform: translateY(-5px);
        }

        #searchInput::placeholder {
            color: white;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark glass">
        <div class="container">

            <a class="navbar-brand fw-bold fs-4">
                🌤️ Kerala Weather
            </a>

           

        </div>
    </nav>


    <!-- Header -->
    <header class="container text-center py-5">

        <h1 class="display-4 fw-bold">
            Kerala Weather Forecast
        </h1>

        <p class="lead">
            Search weather information for Kerala districts
        </p>

    </header>


    <!-- Search -->
    <div class="container mb-5">

        <div class="input-group">

            <input type="text"
                id="searchInput"
                class="form-control rounded-start-pill"
                placeholder="Search district..."
                style="background: transparent; color: white; border: 1px solid white; "/>

            <button class="btn btn-light rounded-end-pill"
                onclick="searchDistrict()">

                Search

            </button>

        </div>

    </div>


    <!-- Weather Cards -->
     <div class="container">
    <div id="container" class="row g-4 justify-content-center"></div>
   </div>
    


    


    <script>

    
        const districts = [
            { name: "Thiruvananthapuram", lat: 8.5241, lon: 76.9366 },
            { name: "Kollam", lat: 8.8932, lon: 76.6141 },
            { name: "Pathanamthitta", lat: 9.2648, lon: 76.7870 },
            { name: "Alappuzha", lat: 9.4981, lon: 76.3388 },
            { name: "Kottayam", lat: 9.5916, lon: 76.5222 },
            { name: "Idukki", lat: 9.8497, lon: 76.9806 },
            { name: "Ernakulam", lat: 9.9816, lon: 76.2999 },
            { name: "Thrissur", lat: 10.5276, lon: 76.2144 },
            { name: "Palakkad", lat: 10.7867, lon: 76.6548 },
            { name: "Malappuram", lat: 11.0728, lon: 76.0740 },
            { name: "Kozhikode", lat: 11.2588, lon: 75.7804 },
            { name: "Wayanad", lat: 11.6103, lon: 76.0827 },
            { name: "Kannur", lat: 11.8745, lon: 75.3704 },
            { name: "Kasaragod", lat: 12.5102, lon: 74.9852 }

        ];


        const latitudes =
            districts.map(d => d.lat).join(",");
        
        const longitudes =
            districts.map(d => d.lon).join(",");

        const api =
            `https://api.open-meteo.com/v1/forecast?latitude=${latitudes}&longitude=${longitudes}&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,apparent_temperature&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=Asia/Kolkata`;

        async function FetchWeather() {

            try {

                const response = await fetch(api);

                const data = await response.json();

                console.log(data);

                localStorage.setItem( "weatherData", JSON.stringify(data) );
            }
            catch (error) {

                console.log(error);

            }

        }


 function displayWeather(weather, district) {

    const container = document.getElementById("container");

    const current = weather.current;
    const daily = weather.daily;

    const card = document.createElement("div");

    card.className = " col-md-6 col-lg-4";

    card.innerHTML = `
    <center>
        <div class="card glass text-white border-0 rounded-4 shadow-lg h-100 w-100">
            <div class="card-body p-4">

                <div class="text-center">
                    <h2 class="fw-bold">📍 ${district.name}</h2>

                    <h1 class="display-3 fw-bold">
                        ${current.temperature_2m}°C
                    </h1>
                </div>

                <div class="row g-3 mt-3">

                    <div class="col-6">
                        <div class="glass rounded-4 p-3 text-center">
                            <i class="fa-solid fa-droplet fs-3"></i>
                            <p>Humidity</p>
                            <h5>${current.relative_humidity_2m}%</h5>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="glass rounded-4 p-3 text-center">
                            <i class="fa-solid fa-wind fs-3"></i>
                            <p>Wind</p>
                            <h5>${current.wind_speed_10m} km/h</h5>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="glass rounded-4 p-3 text-center">
                            <i class="fa-solid fa-temperature-half fs-3"></i>
                            <p>Feels Like</p>
                            <h5>${current.apparent_temperature}°C</h5>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="glass rounded-4 p-3 text-center">
                            <i class="fa-solid fa-cloud-rain fs-3"></i>
                            <p>Rain</p>
                            <h5>${current.precipitation} mm</h5>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="glass rounded-4 p-3 text-center">
                            <p>Max Temp</p>
                            <h5>${daily.temperature_2m_max[0]}°C</h5>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="glass rounded-4 p-3 text-center">
                            <p>Min Temp</p>
                            <h5>${daily.temperature_2m_min[0]}°C</h5>
                        </div>
                    </div>

                </div>

            </div>
        </div>
        </center>
    `;

    container.appendChild(card);
}

        
function searchDistrict() {

    const value = document.getElementById("searchInput").value.toLowerCase();
    const container = document.getElementById("container");
    const data = JSON.parse(localStorage.getItem("weatherData"));

    container.innerHTML = "";

    data.forEach((weather, index) => {

        const district = districts[index];

        if (district.name.toLowerCase().includes(value)) {

            displayWeather(weather, district);

        }

    });

}


        FetchWeather();

    </script>

</body>

</html>
